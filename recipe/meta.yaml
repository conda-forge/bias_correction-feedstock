{% set version = "0.5" %}

package:
  name: bias_correction
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/b/bias-correction/bias_correction-{{ version }}.tar.gz
  sha256: e3afda7c0aa68faf23aec35e486de4b3ef7a9740267946c4792f3e606b20614d

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps -vv"

requirements:
  host:
    - python >=3.6
    - pip
    - setuptools
  run:
    - python >=3.6
    - numpy
    - scipy
    - xarray
    - pandas
    - statsmodels

test:
  imports:
    - bias_correction

about:
  home: https://github.com/pankajkarman/bias_correction
  license: MIT
  license_file: LICENSE
  summary: python library for bias_correction

extra:
  recipe-maintainers:
    - pankajkarman
    - aaronspring
